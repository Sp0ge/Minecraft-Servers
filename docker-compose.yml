name: mcservers
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-managed: &managed
  mcservers.managed: "true"
services:
  plugins:
    cgroup_parent: ${MC_CGROUP_PARENT:-}
    image: minecraft-plugins:local
    build:
      context: ${SOURCE_ROOT:-./ServerData/source}/infra
      dockerfile: Dockerfile.plugins
    volumes: ["${DATA_ROOT:-./ServerData}/plugins:/shared"]
    logging: *logging
  fabric-mod:
    image: minecraft-fabric-mod:local
    build:
      context: ${SOURCE_ROOT:-./ServerData/source}/infra/fabric
    volumes: ["${DATA_ROOT:-./ServerData}/plugins:/shared"]
    logging: *logging
  controller:
    cgroup_parent: ${MC_CGROUP_PARENT:-}
    image: minecraft-controller:local
    build: ${SOURCE_ROOT:-./ServerData/source}/infra
    container_name: mcservers-controller
    stop_grace_period: 900s
    environment:
      ASSETS_HOST_DIR: ${DATA_ROOT:-./ServerData}/assets
      NETWORK_REVISION: ${NETWORK_REVISION:-initial}
      DATA_HOST_DIR: ${DATA_ROOT:?Run start.sh to resolve the data directory}
      MAX_ARENAS: "5"
      ARENA_HEAP: ${ARENA_HEAP:-1536M}
      ARENA_LIMIT_GIB: ${ARENA_LIMIT_GIB:-2.5}
      ARENA_CPUS: ${ARENA_CPUS:-1}
      TOTAL_MEMORY_GIB: ${TOTAL_MEMORY_GIB:-29}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-true}
      MC_CGROUP_PARENT: ${MC_CGROUP_PARENT:-}
      BACKUP_KEEP: "2"
      SURVIVAL_DATA_SUBDIR: survival-fabric-1.20.1
      CHUNK_PREGEN_ENABLED: ${CHUNK_PREGEN_ENABLED:-${MAINTENANCE_ENABLED:-true}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT:-./ServerData}/secrets:/secrets
      - ${DATA_ROOT:-./ServerData}/state:/state
      - ${DATA_ROOT:-./ServerData}/arenas:/arena-data
      - ${DATA_ROOT:-./ServerData}/assets:/assets:ro
    depends_on:
      plugins: {condition: service_completed_successfully}
    mem_limit: 1g
    cpus: 0.5
    labels: *managed
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    logging: *logging
  lobby:
    cgroup_parent: ${MC_CGROUP_PARENT:-}
    image: minecraft-lobby:local
    build: ${SOURCE_ROOT:-./ServerData/source}/lobby
    container_name: mcservers-lobby
    environment:
      NETWORK_REVISION: ${NETWORK_REVISION:-initial}
      ROLE: lobby
      VERSION: "1.21.11"
      MEMORY: ${LOBBY_HEAP:-768M}
      MAX_PLAYERS: "64"
    volumes:
      - ${DATA_ROOT:-./ServerData}/lobby:/data
      - ${DATA_ROOT:-./ServerData}/plugins:/shared:ro
      - ${DATA_ROOT:-./ServerData}/secrets:/secrets:ro
      - ${DATA_ROOT:-./ServerData}/assets:/assets:ro
    depends_on:
      plugins: {condition: service_completed_successfully}
      controller: {condition: service_healthy}
    mem_limit: ${LOBBY_LIMIT:-1536m}
    cpus: 0.5
    labels: *managed
    restart: unless-stopped
    stop_grace_period: 90s
    networks: [internal]
    logging: *logging
  survival:
    cgroup_parent: ${MC_CGROUP_PARENT:-}
    image: minecraft-survival:local
    build: ${SOURCE_ROOT:-./ServerData/source}/survival
    container_name: mcservers-survival
    environment:
      NETWORK_REVISION: ${NETWORK_REVISION:-initial}
      ROLE: survival
      VERSION: "1.20.1"
      CHUNK_PREGEN_ENABLED: ${CHUNK_PREGEN_ENABLED:-${MAINTENANCE_ENABLED:-true}}
      MEMORY: ${SURVIVAL_HEAP:-6G}
      VOICE_PORT: "24454"
      VOICE_PUBLIC_HOST: ${VOICE_PUBLIC_HOST:-}
      JAVA_PROCESSORS: "3"
      MAX_PLAYERS: ${SURVIVAL_MAX_PLAYERS:-64}
    volumes:
      - ${DATA_ROOT:-./ServerData}/survival-fabric-1.20.1:/data
      - ${DATA_ROOT:-./ServerData}/duels-fabric:/duels
      - ${DATA_ROOT:-./ServerData}/plugins:/shared:ro
      - ${DATA_ROOT:-./ServerData}/secrets:/secrets:ro
      - ${DATA_ROOT:-./ServerData}/assets:/assets:ro
    depends_on:
      plugins: {condition: service_completed_successfully}
      fabric-mod: {condition: service_completed_successfully}
      controller: {condition: service_healthy}
    mem_limit: ${SURVIVAL_LIMIT:-8g}
    cpus: 3
    labels: *managed
    restart: unless-stopped
    stop_grace_period: 90s
    ports: ["${BIND_ADDRESS:-127.0.0.1}:24454:24454/udp"]
    networks: [internal]
    logging: *logging
  parkour:
    cgroup_parent: ${MC_CGROUP_PARENT:-}
    image: minecraft-parkour:local
    build: ${SOURCE_ROOT:-./ServerData/source}/parkour
    container_name: mcservers-parkour
    environment:
      NETWORK_REVISION: ${NETWORK_REVISION:-initial}
      ROLE: parkour
      VERSION: "26.3"
      MEMORY: ${PARKOUR_HEAP:-1G}
      MAX_PLAYERS: "64"
    volumes:
      - ${DATA_ROOT:-./ServerData}/parkour:/data
      - ${DATA_ROOT:-./ServerData}/plugins:/shared:ro
      - ${DATA_ROOT:-./ServerData}/secrets:/secrets:ro
      - ${DATA_ROOT:-./ServerData}/assets:/assets:ro
    depends_on:
      plugins: {condition: service_completed_successfully}
      controller: {condition: service_healthy}
    mem_limit: ${PARKOUR_LIMIT:-2g}
    cpus: 1
    labels: *managed
    restart: unless-stopped
    stop_grace_period: 90s
    networks: [internal]
    logging: *logging
  pvp:
    cgroup_parent: ${MC_CGROUP_PARENT:-}
    image: minecraft-pvp:local
    build: ${SOURCE_ROOT:-./ServerData/source}/pvp
    container_name: mcservers-pvp
    environment:
      NETWORK_REVISION: ${NETWORK_REVISION:-initial}
      ROLE: pvp
      VERSION: "1.20.1"
      MEMORY: ${PVP_HEAP:-2G}
      VOICE_PORT: "24455"
      VOICE_PUBLIC_HOST: ${VOICE_PUBLIC_HOST:-}
      JAVA_PROCESSORS: "2"
      MAX_PLAYERS: "64"
    volumes:
      - ${DATA_ROOT:-./ServerData}/pvp-fabric-1.20.1:/data
      - ${DATA_ROOT:-./ServerData}/duels-fabric:/duels
      - ${DATA_ROOT:-./ServerData}/plugins:/shared:ro
      - ${DATA_ROOT:-./ServerData}/secrets:/secrets:ro
      - ${DATA_ROOT:-./ServerData}/assets:/assets:ro
    depends_on:
      plugins: {condition: service_completed_successfully}
      fabric-mod: {condition: service_completed_successfully}
      controller: {condition: service_healthy}
    mem_limit: ${PVP_LIMIT:-3g}
    cpus: 1.5
    labels: *managed
    restart: unless-stopped
    stop_grace_period: 90s
    ports: ["${BIND_ADDRESS:-127.0.0.1}:24455:24455/udp"]
    networks: [internal]
    logging: *logging
  proxy:
    cgroup_parent: ${MC_CGROUP_PARENT:-}
    image: minecraft-proxy:local
    build: ${SOURCE_ROOT:-./ServerData/source}/proxy
    container_name: mcservers-proxy
    environment: {PROXY_MEMORY: "512M"}
    volumes:
      - ${DATA_ROOT:-./ServerData}/proxy:/data
      - ${DATA_ROOT:-./ServerData}/duels-fabric:/duels:ro
      - ${DATA_ROOT:-./ServerData}/secrets:/secrets:ro
      - ${DATA_ROOT:-./ServerData}/assets:/assets:ro
    depends_on:
      controller: {condition: service_healthy}
      lobby: {condition: service_started}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${MC_PORT:-25565}:25565"]
    mem_limit: 1g
    cpus: 0.5
    labels: *managed
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [internal]
    logging: *logging
  pillars-image:
    image: minecraft-pillars:local
    build: ${SOURCE_ROOT:-./ServerData/source}/pillars
    profiles: [build]
    entrypoint: ["python3", "-c", "print('Arena image; instances are started by controller')"]
networks:
  internal:
    name: mcservers_internal
