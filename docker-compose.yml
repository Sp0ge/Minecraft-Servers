name: mcservers
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-managed: &managed
  mcservers.managed: "true"
services:
  plugins:
    image: minecraft-plugins:local
    build:
      context: ${SOURCE_ROOT:-./.runtime/source}/infra
      dockerfile: Dockerfile.plugins
    volumes: [plugins:/shared]
    logging: *logging
  controller:
    image: minecraft-controller:local
    build: ${SOURCE_ROOT:-./.runtime/source}/infra
    container_name: mcservers-controller
    stop_grace_period: 900s
    environment:
      ASSETS_HOST_DIR: ${PROJECT_ROOT:?Set PROJECT_ROOT to the checkout path}/.runtime/assets
      MAX_ARENAS: "5"
      ARENA_HEAP: ${ARENA_HEAP:-2G}
      ARENA_LIMIT_GIB: ${ARENA_LIMIT_GIB:-3}
      ARENA_CPUS: "1.2"
      TOTAL_MEMORY_GIB: ${TOTAL_MEMORY_GIB:-29}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-true}
      BACKUP_KEEP: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - secrets:/secrets
      - state:/state
      - ${PROJECT_ROOT}/.runtime/assets:/assets:ro
    mem_limit: 1g
    cpus: 0.5
    labels: *managed
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    logging: *logging
  lobby:
    image: minecraft-lobby:local
    build: ${SOURCE_ROOT:-./.runtime/source}/lobby
    container_name: mcservers-lobby
    environment:
      ROLE: lobby
      VERSION: "1.21.11"
      MEMORY: ${LOBBY_HEAP:-1G}
      MAX_PLAYERS: "120"
    volumes:
      - lobby:/data
      - plugins:/shared:ro
      - secrets:/secrets:ro
      - ${PROJECT_ROOT}/.runtime/assets:/assets:ro
    depends_on:
      plugins: {condition: service_completed_successfully}
      controller: {condition: service_healthy}
    mem_limit: ${LOBBY_LIMIT:-2g}
    cpus: 0.75
    labels: *managed
    restart: unless-stopped
    stop_grace_period: 90s
    networks: [internal]
    logging: *logging
  survival:
    image: minecraft-survival:local
    build: ${SOURCE_ROOT:-./.runtime/source}/survival
    container_name: mcservers-survival
    environment:
      ROLE: survival
      VERSION: "26.3"
      MEMORY: ${SURVIVAL_HEAP:-8G}
      MAX_PLAYERS: ${SURVIVAL_MAX_PLAYERS:-30}
    volumes:
      - survival:/data
      - plugins:/shared:ro
      - secrets:/secrets:ro
      - ${PROJECT_ROOT}/.runtime/assets:/assets:ro
    depends_on:
      plugins: {condition: service_completed_successfully}
      controller: {condition: service_healthy}
    mem_limit: ${SURVIVAL_LIMIT:-10g}
    cpus: 4
    labels: *managed
    restart: unless-stopped
    stop_grace_period: 90s
    networks: [internal]
    logging: *logging
  proxy:
    image: minecraft-proxy:local
    build: ${SOURCE_ROOT:-./.runtime/source}/proxy
    container_name: mcservers-proxy
    environment: {PROXY_MEMORY: "512M"}
    volumes:
      - proxy:/data
      - secrets:/secrets:ro
      - ${PROJECT_ROOT}/.runtime/assets:/assets:ro
    depends_on:
      controller: {condition: service_healthy}
      lobby: {condition: service_started}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${MC_PORT:-25565}:25565"]
    mem_limit: 1g
    cpus: 0.5
    labels: *managed
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [internal]
    logging: *logging
  pillars-image:
    image: minecraft-pillars:local
    build: ${SOURCE_ROOT:-./.runtime/source}/pillars
    profiles: [build]
    entrypoint: ["python3", "-c", "print('Arena image; instances are started by controller')"]
networks:
  internal:
    name: mcservers_internal
volumes:
  plugins: {name: mcservers_plugins}
  secrets: {name: mcservers_secrets}
  state: {name: mcservers_state}
  lobby: {name: mcservers_lobby}
  survival: {name: mcservers_survival}
  proxy: {name: mcservers_proxy}
  backups: {name: mcservers_backups}
